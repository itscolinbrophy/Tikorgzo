services:
  web:
    build: .
    image: tikorgzo-web:latest
    container_name: tikorgzo-web
    restart: unless-stopped
    ports:
      - "${TIKORGZO_PORT:-8080}:8080"
    environment:
      TIKORGZO_DATA_DIR: /data/downloads
      TIKORGZO_USE_XVFB: "1"
      TIKORGZO_MAX_CONCURRENT: "1"
      TIKORGZO_CHROME_ARGS: "--no-sandbox --disable-dev-shm-usage --disable-gpu"
    shm_size: "1gb"
    volumes:
      - tikorgzo-data:/data

volumes:
  tikorgzo-data:
